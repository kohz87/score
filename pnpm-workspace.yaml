packages:
  - apps/*
  - packages/*

# Pin exact versions on `pnpm add`.
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.71.1'
  - '@typescript-eslint/parser@8.71.1'
  - '@typescript-eslint/project-service@8.71.1'
  - '@typescript-eslint/scope-manager@8.71.1'
  - '@typescript-eslint/tsconfig-utils@8.71.1'
  - '@typescript-eslint/type-utils@8.71.1'
  - '@typescript-eslint/types@8.71.1'
  - '@typescript-eslint/typescript-estree@8.71.1'
  - '@typescript-eslint/utils@8.71.1'
  - '@typescript-eslint/visitor-keys@8.71.1'
  - typescript-eslint@8.71.1
  - vite@8.3.3
  - '@fastify/websocket@11.3.4'

savePrefix: ''

# Install scripts are off unless listed here. esbuild ships its binary as an optional
# dependency (@esbuild/<platform>), so its postinstall is not needed.
allowBuilds:
  esbuild: false
  # node-pty (web terminal, 7.3) has no Linux prebuilt binary: its install script compiles the PTY helper with node-gyp.
  node-pty: true
