<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12131a" />
    <title>Score can't be reached</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #eceef2;
        color: #12131a;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      main {
        background: #fff;
        border-radius: 28px;
        padding: 32px;
        max-width: 360px;
        margin: 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }
      p {
        margin: 0 0 20px;
        color: #5e626c;
      }
      button {
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 999px;
        background: #12131a;
        color: #fff;
        padding: 10px 22px;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #12131a;
          color: #fff;
        }
        main {
          background: #1e2029;
        }
        p {
          color: #c9cbd2;
        }
        button {
          background: #fff;
          color: #12131a;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Score can&rsquo;t be reached</h1>
      <p>Check that this device is online and that Score is running, then try again.</p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script src="/offline.js"></script>
  </body>
</html>
