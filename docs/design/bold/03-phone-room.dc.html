<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Score, bold, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:#12131a}
a{color:#ececf1}
button{font-family:inherit}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-3px);opacity:1}}
@keyframes live{0%,100%{opacity:1}50%{opacity:.35}}
.d1{animation:dot 1.2s infinite}.d2{animation:dot 1.2s .15s infinite}.d3{animation:dot 1.2s .3s infinite}
.live{animation:live 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.d1,.d2,.d3,.live{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #12131a; color: #ececf1; font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 15px; line-height: 1.45; display: flex; flex-direction: column; overflow: hidden; position: relative">

<header style="display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 6px">
<button type="button" aria-label="Back to chats" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: transparent; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ececf1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<b style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px">Activity feed</b>
<span style="font-size: 12px; color: #a9adb8">builder needs you · designer is typing</span>
</div>
<span style="display: inline-flex; align-items: center; gap: 3px; background: #1a1c23; border-radius: 999px; padding: 5px 8px" aria-label="lead idle, builder needs you, reviewer waiting, designer drafting">
<svg width="16" height="16" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12" fill="#6b4eff"/></svg>
<span style="display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 999px; background: #ececf1"><svg width="14" height="14" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 3 L26.5 24.5 H1.5 Z" fill="#19c39a"/></svg></span>
<svg width="16" height="16" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 1.5 L26.5 14 L14 26.5 L1.5 14 Z" fill="#ffb61e"/></svg>
<svg width="16" height="16" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="2" width="24" height="24" rx="8" fill="#ff6b8a"/></svg>
</span>
</header>

<div style="flex: 1; min-height: 0; overflow: hidden; padding: 0 12px 10px; display: flex; flex-direction: column; justify-content: flex-end; gap: 5px">

<div style="margin: 0 0 4px 30px; align-self: flex-start; width: 82%; border: 1px solid #2c2f38; border-radius: 18px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; font-size: 13px">
<span style="display: flex; align-items: center; gap: 6px"><span style="display: inline-flex"><svg width="16" height="16" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 3 L26.5 24.5 H1.5 Z" fill="#19c39a"/></svg><svg width="16" height="16" viewBox="0 0 28 28" aria-hidden="true" style="margin-left: -4px"><path d="M14 1.5 L26.5 14 L14 26.5 L1.5 14 Z" fill="#ffb61e" stroke="#12131a" stroke-width="2"/></svg></span><b>builder and reviewer</b><span style="color: #a9adb8">4 messages</span></span>
<span style="color: #c9ccd4"><b style="color: #ffc94d; font-weight: 600">reviewer</b> Approved, after one fix.</span>
</div>

<span style="font-size: 11px; font-weight: 600; color: #b3a6ff; margin: 6px 0 0 32px">lead</span>
<div style="display: flex; gap: 8px; align-items: flex-end"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true" style="flex: none"><circle cx="14" cy="14" r="12" fill="#6b4eff"/><rect x="9.5" y="11" width="2.6" height="4.4" rx="1.3" fill="#fff"/><rect x="15.9" y="11" width="2.6" height="4.4" rx="1.3" fill="#fff"/></svg>
<div style="display: flex; flex-direction: column; gap: 5px">
<div style="align-self: flex-start; background: #23252e; border-radius: 20px 20px 20px 6px; padding: 9px 14px">Done. Here it is.</div>
<a href="#" style="width: 250px; text-decoration: none; background: #fff; color: #12131a; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
<span style="display: flex; align-items: center; gap: 6px"><b style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 16px">Activity feed</b><span style="margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: #b0283f"><span class="live" style="width: 6px; height: 6px; border-radius: 999px; background: #d93a4e"></span>Live</span></span>
<span style="display: flex; flex-direction: column; gap: 4px; background: #f4f5f8; border-radius: 10px; padding: 6px"><span style="height: 14px; border-radius: 6px; background: #fff; box-shadow: 0 0 0 1.5px #19c39a"></span><span style="height: 14px; border-radius: 6px; background: #fff"></span></span>
<span style="font-size: 12px; color: #00694f; font-weight: 600">Approved · 3 checks pass</span>
</a>
</div>
</div>

<div style="align-self: flex-end; max-width: 80%; background: #ececf1; color: #12131a; border-radius: 20px 20px 6px 20px; padding: 9px 14px; margin-top: 8px">Switch it to websockets.</div>

<span style="font-size: 11px; font-weight: 600; color: #5ee3bf; margin: 6px 0 0 32px">builder</span>
<div style="display: flex; gap: 8px; align-items: flex-end"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true" style="flex: none"><path d="M14 3 L26.5 24.5 H1.5 Z" fill="#19c39a"/><rect x="10.4" y="15" width="2.4" height="4" rx="1.2" fill="#12131a"/><rect x="15.2" y="15" width="2.4" height="4" rx="1.2" fill="#12131a"/></svg>
<div style="width: 260px; background: #ececf1; color: #12131a; border-radius: 20px 20px 20px 6px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px">May I install a package?</span>
<code style="font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 500">npm install ws@8</code>
<span style="display: flex; gap: 6px"><button type="button" style="flex: 1; border: 0; background: #12131a; color: #fff; border-radius: 999px; min-height: 44px; font-weight: 700; font-size: 14px">Allow</button><button type="button" style="flex: 1; border: 1.5px solid #12131a; background: transparent; color: #12131a; border-radius: 999px; min-height: 44px; font-weight: 700; font-size: 14px">Don't allow</button></span>
</div>
</div>

<div style="display: flex; gap: 8px; align-items: center; margin-top: 8px"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true" style="flex: none"><rect x="2" y="2" width="24" height="24" rx="8" fill="#ff6b8a"/><rect x="9.6" y="11" width="2.6" height="4.4" rx="1.3" fill="#fff"/><rect x="15.8" y="11" width="2.6" height="4.4" rx="1.3" fill="#fff"/></svg><span style="display: inline-flex; gap: 4px; background: #23252e; border-radius: 999px; padding: 10px 12px" aria-label="designer is typing"><span class="d1" style="width: 6px; height: 6px; border-radius: 999px; background: #ff97ae"></span><span class="d2" style="width: 6px; height: 6px; border-radius: 999px; background: #ff97ae"></span><span class="d3" style="width: 6px; height: 6px; border-radius: 999px; background: #ff97ae"></span></span></div>
</div>

<div style="padding: 6px 10px 18px">
<div style="display: flex; align-items: center; gap: 6px; background: #1a1c23; border-radius: 999px; padding: 4px 4px 4px 6px">
<button type="button" aria-label="Attach a file" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; display: grid; place-items: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#a9adb8" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<label for="pm" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message</label>
<input id="pm" placeholder="Message the team" style="flex: 1; min-width: 0; border: 0; outline: none; font: inherit; color: #ececf1; background: transparent">
<button type="button" aria-label="Send" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: #ececf1; display: grid; place-items: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#12131a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
