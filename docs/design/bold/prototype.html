    if (k === 'note') { S.view = 'room'; openSide('library', { note: a }); }
    if (k === 'set') A.setSec(a);
    if (k === 'dm') A.dm(a);
    if (k === 'act') ({ start: () => openStart(''), add: () => A.addAgent(), pause: () => A.pauseAll(), look: () => { S.look = S.look === 'dark' ? 'light' : 'dark'; }, recipes: () => { S.modal = { type: 'recipe' }; }, first: () => { S.first = true; } })[a]();
  },
  undo() { if (S.toast && S.toast.undo) S.toast.undo(); S.toast = null; },
  confirmYes() { const fn = pendingConfirm; pendingConfirm = null; S.modal = null; if (fn) fn(); }
};

// ---------- events ----------
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t) { if (S.roomDrop || S.roomMenu || S.jobMenu || S.plus || S.side.menu || S.side.hist) { if (!e.target.closest('.menu')) { S.roomDrop = S.roomMenu = S.jobMenu = S.plus = S.side.menu = S.side.hist = false; render(); } } return; }
  const a = t.dataset.a; if (!A[a]) return;
  if (t.tagName === 'INPUT' && (t.type === 'checkbox' || t.type === 'radio') && ['sjAck', 'codexAck', 'asks', 'tool', 'notif', 'passkey', 'term'].indexOf(a) < 0) { /* radios re-render */ }
  if (a === 'scrim' && e.target !== t) return;
  const r = A[a](t.dataset.v, t, e);
  if (r !== 'norender') render();
});
document.addEventListener('input', e => {
  const t = e.target; const k = t.dataset && t.dataset.in; if (!k) return;
  if (k === 'composer') S.composer = t.value;
  else if (k === 'dm') S.dmText = t.value;
  else if (k === 'sq') { S.search.q = t.value; const box = document.getElementById('sres'); if (box) box.innerHTML = searchList(); }
  else if (k === 'ntitle' || k === 'nbody') { const n = S.library.find(x => x.id === S.side.note); if (n) n[k === 'ntitle' ? 'title' : 'body'] = t.value; }
  else if (k === 'persona') { /* saved through preview */ }
  else if (k === 'model') W[S.team.sel].model = t.value;
  else if (k === 'where') W[S.team.sel].worksOn = t.value;
  else if (k === 'floor') { W[S.team.sel].floor = +t.value; const v = document.getElementById('floorv'); if (v) v.textContent = t.value + '%'; }
  else if (k === 'sjturns') { S.modal.turns = +t.value; document.getElementById('sjturnsv').textContent = t.value; }
  else if (k === 'sjcap') { S.modal.cap = +t.value; document.getElementById('sjcapv').textContent = '$' + t.value; }
  else if (k === 'scale') { S.scale = +t.value; document.documentElement.style.setProperty('--scale', S.scale); }
  else if (k === 'advq') { S.adv.q = t.value; render(); }
  else if (k === 'scrub') { S.replayAt = +t.value === 4 ? null : +t.value; render(); }
  else if (k === 'anname') { /* read on submit */ }
  else if (['rst', 'rsa', 'rsx', 'rsr', 'rsf'].includes(k)) { const r = S.recipes.find(x => x.id === S.rec.sel); const st = r.steps[S.rec.step]; if (!st) return; const f = { rst: 'title', rsa: 'agent', rsx: 'text', rsr: 'retries', rsf: 'fail' }[k]; st[f] = k === 'rsr' ? +t.value : t.value; S.rec.dirty = true; if (k === 'rsa' || k === 'rsr' || k === 'rsf') render(); }
});
document.addEventListener('change', e => { const t = e.target; if (t.dataset && (t.dataset.in === 'rsx' || t.dataset.in === 'rst')) render(); });
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); A.search(); render(); return; }
  if (e.key === 'Escape') { if (S.search.open || S.modal) { S.search.open = false; S.modal = null; render(); } else if (S.roomDrop || S.roomMenu || S.jobMenu || S.plus || S.side.menu || S.side.hist) { S.roomDrop = S.roomMenu = S.jobMenu = S.plus = S.side.menu = S.side.hist = false; render(); } return; }
  if (e.key === 'Enter' && !e.shiftKey) {
    const id = e.target.id;
    if (id === 'composer') { e.preventDefault(); send(); render(); }
    else if (id === 'dmin') { e.preventDefault(); A.dmSend(); render(); }
    else if (id === 'stepin') { e.preventDefault(); A.stepIn(); render(); }
    else if (id === 'sq') { e.preventDefault(); const r = searchResults(S.search.q); if (r[0]) { A.pick(r[0][3]); render(); } }
    else if (id === 'rename') { e.preventDefault(); A.doRename(); render(); }
  }
});
render();
</script>
