<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Subagents on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#12131A}
a{color:#ECECF1}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#12131A;color:#ECECF1;font-family:'Hanken Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <div style="padding:14px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,0.08)">
    <a href="#" aria-label="Back to chats" style="width:44px;height:44px;border-radius:50%;background:#1A1C23;display:flex;align-items:center;justify-content:center;flex:none">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="flex:1;min-width:0">
      <div style="font-family:'Bricolage Grotesque',sans-serif;font-size:19px;font-weight:700">Team room</div>
      <div style="font-size:13px;color:#A6A8B4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Add pagination · 3 of 4 subagents done</div>
    </div>
  </div>
  <div style="flex:1;min-height:0;padding:14px 16px;display:flex;flex-direction:column;gap:10px;overflow:hidden">
    <div style="font-size:13px;color:#B7AAFF;font-weight:600">lead</div>
    <div style="padding:9px 14px;border-radius:18px;background:#22242C;font-size:15px;margin-top:-6px">I'll split this up, then hand it to @reviewer when it's done.</div>
    <button type="button" aria-expanded="false" style="min-height:56px;padding:10px 14px;border-radius:18px;border:0;background:#1A1C23;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.1);color:#ECECF1;font:inherit;text-align:left;display:flex;align-items:center;gap:10px">
      <span style="flex:1"><span style="display:block;font-size:14px;font-weight:700">Subagents · 3 of 4 done</span><span style="display:block;font-size:13px;color:#C4C6D0">One is waiting for you</span></span>
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
    <section data-protected="block" aria-label="Approval needed" style="padding:14px;border-radius:20px;background:#ECECF1;color:#12131A;display:flex;flex-direction:column;gap:8px">
      <div style="font-size:13px;font-weight:700">A subagent of lead wants to run this</div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:13px;padding:8px 10px;border-radius:10px;background:#FFFFFF;overflow-wrap:anywhere">pnpm add @tanstack/react-virtual</div>
      <div style="display:flex;gap:8px">
        <button type="button" style="flex:1;height:44px;border-radius:999px;border:0;background:#12131A;color:#FFFFFF;font:inherit;font-size:14px;font-weight:700">Approve once</button>
        <button type="button" style="flex:1;height:44px;border-radius:999px;border:0;background:transparent;box-shadow:inset 0 0 0 1px rgba(18,19,26,0.45);color:#12131A;font:inherit;font-size:14px;font-weight:600">Deny</button>
      </div>
    </section>
    <div style="padding:8px 12px;border-radius:14px;font-size:14px;color:#C4C6D0;background:#1A1C23">Subagents set to at most <b style="color:#ECECF1">2</b> for this job. <a href="#" style="font-weight:600">Change</a></div>
  </div>
  <div style="margin:0 12px 6px;padding:12px 16px;border-radius:24px;background:#1A1C23;display:flex;align-items:center;gap:10px;font-size:15px;color:#A6A8B4">
    <span aria-hidden="true" style="font-size:20px">+</span><span style="flex:1">Message · / for commands</span>
  </div>
  <div style="margin:0 20px 12px;font-size:13px;color:#A6A8B4;display:flex;gap:10px;align-items:center">
    <span>To <b style="color:#ECECF1">lead</b></span><span>Context 42%</span>
    <button type="button" style="margin-left:auto;height:44px;padding:0 12px;border-radius:999px;border:0;background:#262833;color:#ECECF1;font:inherit;font-size:13px;font-weight:600">Subagents: 2</button>
  </div>
</div>
</x-dc>

  renderVals() { return {}; }

</body>
</html>
