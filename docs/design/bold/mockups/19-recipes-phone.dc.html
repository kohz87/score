<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recipes editor on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#12131A}
a{color:#ECECF1}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#12131A;color:#ECECF1;font-family:'Hanken Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;position:relative;overflow:hidden">
  <header style="height:64px;box-sizing:border-box;padding:0 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,0.08)">
    <a href="#" aria-label="Back to recipes" style="width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:18px">‹</a>
    <div style="flex:1;min-width:0">
      <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:18px">Review and ship</div>
      <div style="font-size:12px;color:#8E91A0">Version 3 · <span style="color:#5BE0A8">Looks good</span></div>
    </div>
    <button type="button" style="height:44px;padding:0 14px;border-radius:999px;border:0;background:#ECECF1;color:#12131A;font:inherit;font-size:13px;font-weight:600">Save</button>
  </header>

  <section aria-label="Recipe graph" style="flex:1;overflow:hidden;padding:16px 14px 0;display:flex;flex-direction:column;align-items:stretch">
    <div style="padding:12px 14px;border-radius:18px;background:#1A1C23;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.14)">
      <div style="font-size:11px;font-weight:700;letter-spacing:1.2px;color:#A6A8B4">YOU · INPUT</div>
      <div style="font-size:14px;margin-top:4px">what changed</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center"><div aria-hidden="true" style="width:1px;height:10px;background:#3A3D4A"></div><button type="button" aria-label="Add a step here" style="width:44px;height:28px;border-radius:999px;border:0;background:#262833;color:#ECECF1">+</button><div aria-hidden="true" style="width:1px;height:10px;background:#3A3D4A"></div></div>
    <div style="padding:12px 14px;border-radius:18px;background:#1A1C23;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.22)">
      <div style="display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:1.2px;color:#5BE0A8"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 2 L12.5 12 H1.5 Z" fill="#2FBF8F"></path></svg>STEP 1 · BUILDER</div>
      <div style="font-size:14px;font-weight:600;margin-top:4px">Write the change</div>
    </div>
    <div style="display:flex;justify-content:center"><div aria-hidden="true" style="width:1px;height:14px;background:#3A3D4A"></div></div>
    <div style="font-size:11px;color:#8E91A0;text-align:center;margin-bottom:6px">at the same time</div>
    <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px">
      <div style="padding:12px;border-radius:18px;background:#1A1C23;box-shadow:inset 0 0 0 2px #F2B134">
        <div style="display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:1px;color:#F2B134"><svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1 L13 7 L7 13 L1 7 Z" fill="#F2B134"></path></svg>2 · REVIEWER</div>
        <div style="font-size:13px;font-weight:600;margin-top:4px">Review the diff</div>
      </div>
      <div style="padding:12px;border-radius:18px;background:#1A1C23;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.22)">
        <div style="display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:1px;color:#FF7A8C"><svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="2" width="10" height="10" rx="3" fill="#FF6B81"></rect></svg>3 · DESIGNER</div>
        <div style="font-size:13px;font-weight:600;margin-top:4px">Screenshots</div>
      </div>
    </div>
    <div style="display:flex;justify-content:center"><div aria-hidden="true" style="width:1px;height:14px;background:#3A3D4A"></div></div>
    <div style="padding:12px 14px;border-radius:18px;background:#ECECF1;color:#12131A">
      <div style="font-size:11px;font-weight:700;letter-spacing:1.2px;color:#4A2FD9">YOU · APPROVAL</div>
      <div style="font-size:14px;font-weight:600;margin-top:4px">You look at the review and screenshots</div>
    </div>
  </section>

  <div role="dialog" aria-label="Step 2 settings" style="position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;padding:12px 16px 20px;border-radius:24px 24px 0 0;background:#1A1C23;box-shadow:0 -12px 40px rgba(0,0,0,0.5);display:flex;flex-direction:column;gap:12px">
    <div aria-hidden="true" style="align-self:center;width:40px;height:4px;border-radius:2px;background:#3A3D4A"></div>
    <div style="display:flex;align-items:center;gap:8px">
      <div style="flex:1">
        <div style="font-size:11px;font-weight:700;letter-spacing:1.2px;color:#F2B134">STEP 2 · REVIEWER</div>
        <div style="font-family:'Bricolage Grotesque',sans-serif;font-size:20px;font-weight:700">Review the diff</div>
      </div>
      <button type="button" aria-label="Close step settings" style="width:44px;height:44px;border-radius:50%;border:0;background:#262833;color:#ECECF1;font-size:18px">×</button>
    </div>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:#A6A8B4">Instruction
      <textarea rows="3" style="border-radius:14px;border:0;background:#262833;color:#ECECF1;padding:10px 12px;font:inherit;font-size:14px;resize:none">Review step 1's change. List real problems only.</textarea>
    </label>
    <div style="display:flex;gap:8px">
      <button type="button" style="flex:1;height:44px;border-radius:999px;border:0;background:#262833;color:#ECECF1;font:inherit;font-size:13px;font-weight:600">More settings</button>
      <button type="button" style="flex:1;height:44px;border-radius:999px;border:0;background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.25);color:#ECECF1;font:inherit;font-size:13px;font-weight:600">Delete step</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
