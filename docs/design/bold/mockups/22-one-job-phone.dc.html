<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One job per chat on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#12131A}
a{color:#ECECF1}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#12131A;color:#ECECF1;font-family:'Hanken Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <div style="padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,0.08)">
    <a href="#" aria-label="Back to chats" style="width:44px;height:44px;border-radius:50%;background:#1A1C23;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:18px">‹</a>
    <div style="flex:1;min-width:0">
      <div style="font-family:'Bricolage Grotesque',sans-serif;font-size:19px;font-weight:700">Team room</div>
      <div style="font-size:12px;color:#A6A8B4">4 members</div>
    </div>
    <button type="button" style="height:44px;padding:0 14px;border-radius:999px;border:0;background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.3);color:#ECECF1;font:inherit;font-size:13px;font-weight:600">Info</button>
  </div>

  <section aria-label="Current job" style="margin:12px 16px 0;padding:12px 14px;border-radius:18px;background:#1A1C23;display:flex;align-items:center;gap:10px">
    <span aria-hidden="true" style="width:10px;height:10px;border-radius:50%;background:#4FD1A5;flex:none"></span>
    <div style="flex:1;min-width:0">
      <div style="font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Story suite prompts</div>
      <div style="font-size:12px;color:#A6A8B4">lead is working · $0.42 of $5.00</div>
    </div>
    <button type="button" style="height:44px;padding:0 14px;border-radius:999px;border:0;background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.3);color:#ECECF1;font:inherit;font-size:13px;font-weight:600">Stop job</button>
  </section>

  <div style="flex:1;min-height:0;padding:16px;display:flex;flex-direction:column;gap:12px">
    <div style="align-self:flex-end;padding:10px 14px;border-radius:18px;background:#22242C;font-size:15px;max-width:300px;overflow-wrap:anywhere">@lead write the prompts for the story suite. The full prompt is in /home/raven/score-workspaces/story_suite/prompt.md</div>
    <div style="display:flex;flex-direction:column;gap:4px;max-width:300px">
      <span style="font-size:12px;color:#8E7CFF;font-weight:600">lead</span>
      <div style="padding:10px 14px;border-radius:18px;background:#22242C;font-size:15px">On it: outline, drafts, then review.</div>
    </div>
  </div>

  <div style="margin:0 12px 16px;padding:14px 16px;border-radius:24px;background:#1A1C23;color:#A6A8B4;font-size:15px">+ Message the chat</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
