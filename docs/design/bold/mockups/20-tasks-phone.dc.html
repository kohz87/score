<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks on a phone, a task open</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#12131A}
a{color:#ECECF1}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#12131A;color:#ECECF1;font-family:'Hanken Grotesk',system-ui,sans-serif;position:relative;overflow:hidden">
  <div style="padding:18px 16px;display:flex;align-items:center;gap:10px">
    <h1 style="flex:1;margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:26px">Tasks</h1>
    <button type="button" style="display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 14px 0 12px;border-radius:999px;border:0;background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.3);color:#ECECF1;font:inherit;font-size:13px;font-weight:600;line-height:1"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg><span>New task</span></button>
  </div>
  <div style="padding:0 16px;display:flex;flex-direction:column;gap:10px">
    <div style="padding:14px;border-radius:18px;background:#1A1C23;box-shadow:inset 0 0 0 2px #ECECF1">
      <div style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#8E91A0">T-101 · Working</div>
      <div style="font-weight:600;font-size:15px;margin-top:4px">Add pagination to the activity feed</div>
    </div>
  </div>
  <div role="dialog" aria-label="Task T-101" style="position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;padding:12px 16px 22px;border-radius:24px 24px 0 0;background:#1A1C23;box-shadow:0 -12px 40px rgba(0,0,0,0.5);display:flex;flex-direction:column;gap:12px">
    <div aria-hidden="true" style="align-self:center;width:40px;height:4px;border-radius:2px;background:#3A3D4A"></div>
    <div style="display:flex;align-items:center;gap:8px">
      <span style="flex:1;font-family:'JetBrains Mono',monospace;font-size:12px;color:#8E91A0">T-101 · Working · builder</span>
      <button type="button" aria-label="Close" style="width:44px;height:44px;border-radius:50%;border:0;background:#262833;color:#ECECF1;font-size:18px">×</button>
    </div>
    <div style="font-family:'Bricolage Grotesque',sans-serif;font-size:20px;font-weight:700">Add pagination to the activity feed</div>
    <div style="font-size:14px;color:#A6A8B4">Page the feed by (created_at, id), newest first.</div>
    <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:8px">
      <button type="button" style="height:44px;border-radius:999px;border:0;background:#262833;color:#ECECF1;font:inherit;font-size:13px;font-weight:600">Edit</button>
      <button type="button" style="height:44px;border-radius:999px;border:0;background:#262833;color:#ECECF1;font:inherit;font-size:13px;font-weight:600">Ask for review</button>
      <button type="button" style="height:44px;border-radius:999px;border:0;background:#262833;color:#ECECF1;font:inherit;font-size:13px;font-weight:600">Mark done</button>
      <button type="button" style="height:44px;border-radius:999px;border:0;background:transparent;box-shadow:inset 0 0 0 1px #FF8A9B;color:#FF8A9B;font:inherit;font-size:13px;font-weight:600">Archive…</button>
    </div>
  </div>
</div>
</x-dc>

</body>
</html>
