<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks, new task</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#12131A}
a{color:#ECECF1}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width:1440px;height:900px;box-sizing:border-box;background:#0C0D12;color:#ECECF1;font-family:'Hanken Grotesk',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;position:relative">
  <div aria-hidden="true" style="position:absolute;left:24px;top:116px;display:flex;align-items:center;gap:16px;opacity:0.55">
    <span style="font-family:'Bricolage Grotesque',sans-serif;font-size:30px;font-weight:700">Tasks</span>
    <span style="display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px 0 12px;border-radius:999px;color:#ECECF1;font-size:13px;font-weight:600;line-height:1;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.3), 0 0 0 3px rgba(242,177,52,0.9)"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg><span>New task</span></span>
    <span style="font-size:13px;color:#F2B134;opacity:1">← pressed here opens this</span>
  </div>
  <div role="dialog" aria-label="New task" style="width:560px;box-sizing:border-box;padding:28px;border-radius:28px;background:#1A1C23;box-shadow:0 30px 80px rgba(0,0,0,0.55);display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;align-items:center">
      <h2 style="flex:1;margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:26px">New task</h2>
      <button type="button" aria-label="Close" style="width:44px;height:44px;border-radius:50%;border:0;background:#262833;color:#ECECF1;font-size:18px">×</button>
    </div>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:#A6A8B4">What needs doing
      <input placeholder="A short title" style="height:48px;box-sizing:border-box;border-radius:14px;border:0;background:#262833;color:#ECECF1;padding:0 14px;font:inherit;font-size:16px">
    </label>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:#A6A8B4">Details (optional)
      <textarea rows="4" placeholder="What done looks like, links, constraints" style="border-radius:14px;border:0;background:#262833;color:#ECECF1;padding:12px 14px;font:inherit;font-size:14px;resize:none"></textarea>
    </label>
    <div style="display:flex;gap:10px">
      <label style="flex:1;display:flex;flex-direction:column;gap:6px;font-size:13px;color:#A6A8B4">Who does it
        <select style="height:44px;border-radius:14px;border:0;background:#262833;color:#ECECF1;padding:0 12px;font:inherit;font-size:14px"><option>builder</option></select>
      </label>
      <label style="flex:1;display:flex;flex-direction:column;gap:6px;font-size:13px;color:#A6A8B4">In which chat
        <select style="height:44px;border-radius:14px;border:0;background:#262833;color:#ECECF1;padding:0 12px;font:inherit;font-size:14px"><option>Team room</option></select>
      </label>
    </div>
    <fieldset style="border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px">
      <legend style="font-size:13px;color:#A6A8B4;margin-bottom:8px">Start</legend>
      <div style="display:flex;gap:8px">
        <label style="display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;box-shadow:inset 0 0 0 1.5px #ECECF1;font-size:14px;font-weight:600"><input type="radio" name="start" checked> Now</label>
        <label style="display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.2);font-size:14px;font-weight:600"><input type="radio" name="start"> Plan it for later</label>
      </div>
    </fieldset>
    <p style="margin:0;font-size:13px;color:#8E91A0">The same as typing <span style="font-family:'JetBrains Mono',monospace;color:#ECECF1">/assign @builder …</span> in a chat.</p>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button type="button" style="height:44px;padding:0 16px;border-radius:999px;border:0;background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.25);color:#ECECF1;font:inherit;font-size:14px;font-weight:600">Cancel</button>
      <button type="button" style="height:44px;padding:0 20px;border-radius:999px;border:0;background:#ECECF1;color:#12131A;font:inherit;font-size:14px;font-weight:700">Create task</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
