<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Start a job</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#12131A}
a{color:#ECECF1}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width:1440px;height:900px;box-sizing:border-box;background:#0C0D12;color:#ECECF1;font-family:'Hanken Grotesk',system-ui,sans-serif;display:flex;align-items:center;justify-content:center">
  <section role="dialog" aria-label="Start a job" style="width:720px;box-sizing:border-box;padding:26px 28px;border-radius:28px;background:#1A1C23;display:flex;flex-direction:column;gap:18px">
    <div style="font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:700">Start a job</div>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600">What needs doing
      <textarea rows="2" style="padding:12px 14px;border-radius:16px;border:0;background:#262833;color:#ECECF1;font:inherit;font-size:15px;font-weight:400;resize:none">Add pagination to the activity feed, then get it reviewed</textarea>
    </label>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px">
      <label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600">Lead
        <select style="height:44px;padding:0 12px;border-radius:14px;border:0;background:#262833;color:#ECECF1;font:inherit;font-size:15px;font-weight:400"><option>lead</option></select>
      </label>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600">Spend cap
        <input value="$5.00" style="height:44px;box-sizing:border-box;padding:0 12px;border-radius:14px;border:0;background:#262833;color:#ECECF1;font:inherit;font-size:15px;font-weight:400">
      </label>
    </div>

    <fieldset style="margin:0;padding:16px 18px;border:0;border-radius:20px;background:#22242C;display:flex;flex-direction:column;gap:12px">
      <legend style="float:left;padding:0;font-size:15px;font-weight:700">Subagents</legend>
      <div style="clear:both;font-size:14px;color:#C4C6D0">The lead can split work among helpers of its own. They don't join the chat.</div>
      <div style="display:flex;gap:6px" role="radiogroup" aria-label="Subagents">
        <button type="button" role="radio" aria-checked="false" style="height:44px;padding:0 18px;border-radius:999px;border:0;background:#2F3240;color:#ECECF1;font:inherit;font-size:14px;font-weight:600">Off</button>
        <button type="button" role="radio" aria-checked="false" style="height:44px;width:52px;border-radius:999px;border:0;background:#2F3240;color:#ECECF1;font:inherit;font-size:14px;font-weight:600">1</button>
        <button type="button" role="radio" aria-checked="false" style="height:44px;width:52px;border-radius:999px;border:0;background:#2F3240;color:#ECECF1;font:inherit;font-size:14px;font-weight:600">2</button>
        <button type="button" role="radio" aria-checked="false" style="height:44px;width:52px;border-radius:999px;border:0;background:#2F3240;color:#ECECF1;font:inherit;font-size:14px;font-weight:600">3</button>
        <button type="button" role="radio" aria-checked="true" style="height:44px;width:52px;border-radius:999px;border:0;background:#ECECF1;color:#12131A;font:inherit;font-size:14px;font-weight:700">4</button>
      </div>
      <div style="font-size:13px;color:#C4C6D0">At once. lead's limit is 4; set in its settings.</div>
      <label style="display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600">Total in this job
        <input value="20" aria-label="Total subagents in this job" style="height:40px;width:72px;box-sizing:border-box;padding:0 12px;border-radius:12px;border:0;background:#2F3240;color:#ECECF1;font:inherit;font-size:15px;font-weight:400">
        <span style="font-weight:400;color:#C4C6D0">then the job pauses and asks you</span>
      </label>
    </fieldset>

    <div style="padding:14px 18px;border-radius:20px;background:#22242C;display:flex;flex-direction:column;gap:8px">
      <div style="font-size:15px;font-weight:700">Voters</div>
      <div style="font-size:14px;color:#C4C6D0">Named agents the lead can ask when a decision is close. Score counts the answers.</div>
      <div style="display:flex;gap:6px;align-items:center;font-size:14px">
        <span style="padding:9px 14px;border-radius:999px;background:#2F3240;font-weight:600">voter</span>
        <span style="padding:9px 14px;border-radius:999px;background:#2F3240;font-weight:600">voter-2</span>
        <button type="button" style="height:40px;padding:0 14px;border-radius:999px;border:0;background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.3);color:#ECECF1;font:inherit;font-size:14px;font-weight:600">Add</button>
      </div>
    </div>

    <div style="display:flex;justify-content:flex-end;gap:8px">
      <button type="button" style="height:48px;padding:0 20px;border-radius:999px;border:0;background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.3);color:#ECECF1;font:inherit;font-size:15px;font-weight:600">Cancel</button>
      <button type="button" style="height:48px;padding:0 24px;border-radius:999px;border:0;background:#ECECF1;color:#12131A;font:inherit;font-size:15px;font-weight:700">Start</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
