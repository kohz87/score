<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Score, bold, usage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:#12131a}
a{color:#ececf1}a:hover{color:#b3a6ff}
button{font-family:inherit;cursor:pointer}
.bar:hover{filter:brightness(1.15)}
</style>
</helmet>
<div style="min-height: 900px; background: #12131a; color: #ececf1; font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 16px; line-height: 1.55; display: flex; flex-direction: column">

<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 18px 28px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.04em">score</span>
<nav aria-label="Main" style="display: flex; gap: 2px">
<a href="1-team-room.dc.html" style="text-decoration: none; border-radius: 999px; padding: 0 14px; min-height: 40px; display: inline-flex; align-items: center; font-size: 14px; font-weight: 600; color: #a9adb8">Room</a>
<a href="4-team.dc.html" style="text-decoration: none; border-radius: 999px; padding: 0 14px; min-height: 40px; display: inline-flex; align-items: center; font-size: 14px; font-weight: 600; color: #a9adb8">Team</a>
</nav>
<a href="#" aria-current="page" aria-label="Settings" style="margin-left: auto; width: 40px; height: 40px; border-radius: 999px; background: #ececf1; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#12131a" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></a>
<span aria-label="You" style="width: 36px; height: 36px; border-radius: 999px; background: #ececf1; color: #12131a; display: grid; place-items: center; font-weight: 700; font-size: 14px">Y</span>
</header>

<div style="flex: 1; display: flex; flex-wrap: wrap; gap: 32px; padding: 20px 40px 40px; box-sizing: border-box; align-items: flex-start">

<!-- Four groups instead of fifteen sections -->
<nav aria-label="Settings" style="flex: 1 1 200px; max-width: 240px; display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0 0 14px 12px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -0.03em">Settings</h1>
<a href="#" style="text-decoration: none; display: flex; flex-direction: column; border-radius: 18px; padding: 10px 14px"><b style="font-weight: 600">Connections</b><span style="font-size: 13px; color: #a9adb8">Hermes, models, Telegram</span></a>
<a href="#" style="text-decoration: none; display: flex; flex-direction: column; border-radius: 18px; padding: 10px 14px"><b style="font-weight: 600">Look</b><span style="font-size: 13px; color: #a9adb8">Dark or light, themes</span></a>
<a href="#" aria-current="page" style="text-decoration: none; display: flex; flex-direction: column; border-radius: 18px; padding: 10px 14px; background: #1a1c23"><b style="font-weight: 600">Usage</b><span style="font-size: 13px; color: #a9adb8">What got done, what it cost</span></a>
<a href="#" style="text-decoration: none; display: flex; flex-direction: column; border-radius: 18px; padding: 10px 14px"><b style="font-weight: 600">System</b><span style="font-size: 13px; color: #a9adb8">Backups, logs, updates</span></a>
</nav>

<main style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<h2 style="margin: 0; flex: 1; font-family: 'Bricolage Grotesque', sans-serif; font-size: 40px; font-weight: 700; letter-spacing: -0.03em">Usage</h2>
<label for="range" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Time range</label>
<select id="range" style="font: inherit; font-size: 14px; font-weight: 600; color: #ececf1; background: #1a1c23; border: 0; border-radius: 999px; min-height: 44px; padding: 0 16px"><option>This week</option><option>Last week</option><option>This month</option></select>
<button type="button" style="border: 0; background: #1a1c23; color: #ececf1; border-radius: 999px; min-height: 44px; padding: 0 16px; font-weight: 600; font-size: 14px">Download CSV</button>
</div>

<!-- Three headline numbers -->
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
<div style="background: #1a1c23; border-radius: 24px; padding: 20px 22px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; color: #a9adb8">Tasks done</span><b style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 48px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1">23</b><span style="font-size: 13px; color: #a9adb8">5 more than last week</span></div>
<div style="background: #1a1c23; border-radius: 24px; padding: 20px 22px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; color: #a9adb8">Sent back by reviewer</span><b style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 48px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1">4</b><span style="font-size: 13px; color: #a9adb8">All fixed in the next round</span></div>
<div style="background: #1a1c23; border-radius: 24px; padding: 20px 22px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; color: #a9adb8">Spend</span><b style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 48px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1">$6.80</b><span style="font-size: 13px; color: #a9adb8">Where providers report it</span></div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">

<!-- Tasks per day: one series, no legend -->
<figure style="margin: 0; background: #1a1c23; border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
<figcaption style="display: flex; align-items: baseline; gap: 10px"><b style="font-size: 16px">Tasks done per day</b><a href="#" style="margin-left: auto; font-size: 13px; color: #a9adb8">Show as table</a></figcaption>
<div role="img" aria-label="Tasks done per day this week: Mon 3, Tue 5, Wed 2, Thu 6, Fri 4, Sat 1, Sun 2" style="position: relative; height: 200px; display: flex; align-items: flex-end; gap: 2px; border-bottom: 1px solid #3a3d45; padding: 0 4px">
<span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 40px; border-top: 1px dashed #2c2f38"></span>
<span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 120px; border-top: 1px dashed #2c2f38"></span>
<span style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%"><span class="bar" title="Mon: 3 tasks" style="width: 60%; height: 80px; background: #c9ccd4; border-radius: 4px 4px 0 0"></span></span>
<span style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%"><span class="bar" title="Tue: 5 tasks" style="width: 60%; height: 133px; background: #c9ccd4; border-radius: 4px 4px 0 0"></span></span>
<span style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%"><span class="bar" title="Wed: 2 tasks" style="width: 60%; height: 53px; background: #c9ccd4; border-radius: 4px 4px 0 0"></span></span>
<span style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%"><span style="font-size: 13px; font-weight: 700; color: #ececf1; margin-bottom: 4px">6</span><span class="bar" title="Thu: 6 tasks" style="width: 60%; height: 160px; background: #ececf1; border-radius: 4px 4px 0 0"></span></span>
<span style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%"><span class="bar" title="Fri: 4 tasks" style="width: 60%; height: 107px; background: #c9ccd4; border-radius: 4px 4px 0 0"></span></span>
<span style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%"><span class="bar" title="Sat: 1 task" style="width: 60%; height: 27px; background: #c9ccd4; border-radius: 4px 4px 0 0"></span></span>
<span style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%"><span class="bar" title="Sun: 2 tasks" style="width: 60%; height: 53px; background: #c9ccd4; border-radius: 4px 4px 0 0"></span></span>
</div>
<div aria-hidden="true" style="display: flex; gap: 2px; padding: 0 4px; font-size: 12px; color: #a9adb8; text-align: center"><span style="flex: 1">Mon</span><span style="flex: 1">Tue</span><span style="flex: 1">Wed</span><span style="flex: 1">Thu</span><span style="flex: 1">Fri</span><span style="flex: 1">Sat</span><span style="flex: 1">Sun</span></div>
</figure>

<!-- Spend by agent: each bar names its agent, colour follows the agent -->
<figure style="margin: 0; background: #1a1c23; border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
<figcaption style="display: flex; align-items: baseline; gap: 10px"><b style="font-size: 16px">Spend by agent</b><a href="#" style="margin-left: auto; font-size: 13px; color: #a9adb8">Show as table</a></figcaption>
<div role="img" aria-label="Spend by agent this week: builder $3.10, designer $1.60, reviewer $1.40, lead $0.70" style="display: flex; flex-direction: column; gap: 16px; padding-top: 6px">
<div style="display: flex; align-items: center; gap: 12px"><span style="width: 104px; flex: none; display: inline-flex; align-items: center; gap: 8px; font-size: 14px"><svg width="16" height="16" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 3 L26.5 24.5 H1.5 Z" fill="#14a985"/></svg>builder</span><span style="flex: 1; display: flex; align-items: center; gap: 8px"><span class="bar" title="builder: $3.10" style="width: 82%; height: 22px; background: #14a985; border-radius: 0 4px 4px 0"></span><span style="font-size: 13px; color: #ececf1">$3.10</span></span></div>
<div style="display: flex; align-items: center; gap: 12px"><span style="width: 104px; flex: none; display: inline-flex; align-items: center; gap: 8px; font-size: 14px"><svg width="16" height="16" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="2" width="24" height="24" rx="8" fill="#e85a7a"/></svg>designer</span><span style="flex: 1; display: flex; align-items: center; gap: 8px"><span class="bar" title="designer: $1.60" style="width: 42%; height: 22px; background: #e85a7a; border-radius: 0 4px 4px 0"></span><span style="font-size: 13px; color: #ececf1">$1.60</span></span></div>
<div style="display: flex; align-items: center; gap: 12px"><span style="width: 104px; flex: none; display: inline-flex; align-items: center; gap: 8px; font-size: 14px"><svg width="16" height="16" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 1.5 L26.5 14 L14 26.5 L1.5 14 Z" fill="#c08a10"/></svg>reviewer</span><span style="flex: 1; display: flex; align-items: center; gap: 8px"><span class="bar" title="reviewer: $1.40" style="width: 37%; height: 22px; background: #c08a10; border-radius: 0 4px 4px 0"></span><span style="font-size: 13px; color: #ececf1">$1.40</span></span></div>
<div style="display: flex; align-items: center; gap: 12px"><span style="width: 104px; flex: none; display: inline-flex; align-items: center; gap: 8px; font-size: 14px"><svg width="16" height="16" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12" fill="#7a61ff"/></svg>lead</span><span style="flex: 1; display: flex; align-items: center; gap: 8px"><span class="bar" title="lead: $0.70" style="width: 19%; height: 22px; background: #7a61ff; border-radius: 0 4px 4px 0"></span><span style="font-size: 13px; color: #ececf1">$0.70</span></span></div>
</div>
<span style="font-size: 13px; color: #a9adb8">Free models count as $0.</span>
</figure>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
