<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add an agent</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#12131a}
a{color:#ececf1}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="min-height: 900px; background: #0b0c10; color: #ececf1; font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 15px; line-height: 1.5; display: grid; place-items: center; padding: 40px 16px; box-sizing: border-box">

<div role="dialog" aria-label="Add an agent" style="width: 100%; max-width: 760px; background: #1a1c23; border-radius: 32px; padding: 32px; display: flex; flex-direction: column; gap: 24px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6)">
<div style="display: flex; align-items: center; gap: 12px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -0.03em">Add an agent</h1>
<button type="button" aria-label="Close" style="margin-left: auto; width: 44px; height: 44px; border-radius: 999px; border: 0; background: #23252e; color: #ececf1; display: grid; place-items: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ececf1" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>

<div role="radiogroup" aria-label="Start from" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<button type="button" role="radio" aria-checked="true" style="border: 0; text-align: left; background: #ececf1; color: #12131a; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px"><b>New agent</b><span style="font-size: 13px; color: #3a3d45">A fresh Hermes profile</span></button>
<button type="button" role="radio" aria-checked="false" style="border: 0; text-align: left; background: #23252e; color: #ececf1; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px"><b>Bring one in</b><span style="font-size: 13px; color: #a9adb8">Import a Hermes profile</span></button>
<button type="button" role="radio" aria-checked="false" style="border: 0; text-align: left; background: #23252e; color: #ececf1; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px"><b>Coding tool</b><span style="font-size: 13px; color: #a9adb8">A coding CLI as a team member</span></button>
</div>

<div style="display: flex; gap: 24px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; width: 150px">
<svg width="110" height="110" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="2" width="24" height="24" rx="8" fill="#6b8cff"/><rect x="9.6" y="11" width="2.6" height="4.4" rx="1.3" fill="#fff"/><rect x="15.8" y="11" width="2.6" height="4.4" rx="1.3" fill="#fff"/></svg>
<span style="font-size: 13px; color: #a9adb8">Shape and colour</span>
<div role="radiogroup" aria-label="Shape" style="display: flex; gap: 6px">
<button type="button" role="radio" aria-checked="false" aria-label="Circle" style="width: 32px; height: 32px; border: 0; border-radius: 10px; background: #23252e; display: grid; place-items: center"><svg width="16" height="16" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12" fill="#c9ccd4"/></svg></button>
<button type="button" role="radio" aria-checked="false" aria-label="Triangle" style="width: 32px; height: 32px; border: 0; border-radius: 10px; background: #23252e; display: grid; place-items: center"><svg width="16" height="16" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 3 L26.5 24.5 H1.5 Z" fill="#c9ccd4"/></svg></button>
<button type="button" role="radio" aria-checked="false" aria-label="Diamond" style="width: 32px; height: 32px; border: 0; border-radius: 10px; background: #23252e; display: grid; place-items: center"><svg width="16" height="16" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 1.5 L26.5 14 L14 26.5 L1.5 14 Z" fill="#c9ccd4"/></svg></button>
<button type="button" role="radio" aria-checked="true" aria-label="Square" style="width: 32px; height: 32px; border: 0; border-radius: 10px; background: #ececf1; display: grid; place-items: center"><svg width="16" height="16" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="2" width="24" height="24" rx="8" fill="#12131a"/></svg></button>
</div>
<div role="radiogroup" aria-label="Colour" style="display: flex; gap: 6px">
<button type="button" role="radio" aria-checked="true" aria-label="Blue" style="width: 24px; height: 24px; border: 0; border-radius: 999px; background: #6b8cff; box-shadow: 0 0 0 2px #1a1c23, 0 0 0 4px #ececf1"></button>
<button type="button" role="radio" aria-checked="false" aria-label="Violet, used by lead" style="width: 24px; height: 24px; border: 0; border-radius: 999px; background: #6b4eff; opacity: 0.35"></button>
<button type="button" role="radio" aria-checked="false" aria-label="Jade, used by builder" style="width: 24px; height: 24px; border: 0; border-radius: 999px; background: #19c39a; opacity: 0.35"></button>
<button type="button" role="radio" aria-checked="false" aria-label="Saffron, used by reviewer" style="width: 24px; height: 24px; border: 0; border-radius: 999px; background: #ffb61e; opacity: 0.35"></button>
</div>
<span style="font-size: 12px; color: #a9adb8; text-align: center">Faded colours are taken</span>
</div>

<div style="flex: 1; min-width: 280px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="nm" style="font-size: 14px; font-weight: 600; color: #a9adb8">Name</label><input id="nm" value="researcher" style="font: inherit; font-size: 18px; color: #ececf1; background: #23252e; border: 0; border-radius: 14px; min-height: 50px; padding: 0 16px"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="role" style="font-size: 14px; font-weight: 600; color: #a9adb8">What does it do?</label><textarea id="role" rows="3" style="font: inherit; color: #ececf1; background: #23252e; border: 0; border-radius: 16px; padding: 12px 16px; resize: vertical">Finds and compares options, reads the docs, and writes a short summary with sources.</textarea></div>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<div style="flex: 1 1 180px; display: flex; flex-direction: column; gap: 6px"><label for="md" style="font-size: 14px; font-weight: 600; color: #a9adb8">Model</label><select id="md" style="font: inherit; color: #ececf1; background: #23252e; border: 0; border-radius: 14px; min-height: 48px; padding: 0 14px"><option>Team default</option></select></div>
<div style="flex: 1 1 180px; display: flex; flex-direction: column; gap: 6px"><label for="wo" style="font-size: 14px; font-weight: 600; color: #a9adb8">Works on</label><select id="wo" style="font: inherit; color: #ececf1; background: #23252e; border: 0; border-radius: 14px; min-height: 48px; padding: 0 14px"><option>Docker sandbox</option><option>Your machine</option><option>Another machine (SSH)</option></select></div>
</div>
</div>
</div>

<div style="display: flex; align-items: center; gap: 10px; border-top: 1px solid #2c2f38; padding-top: 18px">
<span style="font-size: 13px; color: #a9adb8">It joins the team room. You can change everything later.</span>
<button type="button" style="margin-left: auto; border: 0; background: transparent; color: #ececf1; border-radius: 999px; min-height: 48px; padding: 0 16px; font-weight: 700">Cancel</button>
<button type="button" style="border: 0; background: #ececf1; color: #12131a; border-radius: 999px; min-height: 48px; padding: 0 24px; font-weight: 700; font-size: 15px">Add researcher</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
